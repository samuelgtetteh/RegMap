# Core, cluster-agnostic set. Apply with:  kubectl apply -k regmap_engine/k8s
# GPU + KEDA scale-to-zero are opt-in (apply gpu-deployment.yaml / keda-scaledobject.yaml
# separately on a GPU cluster) so this base applies cleanly on Docker Desktop.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  # - hpa.yaml   <-- deliberately NOT applied: SQLite is single-writer and the ledger PVC is
  #               ReadWriteOnce, so autoscaling would split or corrupt the billing ledger.
  #               Re-enable once DATABASE_URL points at managed Postgres.
