apiVersion: v1
kind: Service
metadata:
  name: regmap-engine
  namespace: regmap
  labels: { app: regmap-engine }
spec:
  type: ClusterIP          # reach it with: kubectl -n regmap port-forward svc/regmap-engine 8010:80
  selector: { app: regmap-engine }   # spans cpu + gpu tiers (both carry app=regmap-engine)
  ports:
    - { name: http, port: 80, targetPort: http }
