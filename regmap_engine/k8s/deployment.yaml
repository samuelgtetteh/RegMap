apiVersion: apps/v1
kind: Deployment
metadata:
  name: regmap-engine
  namespace: regmap
  labels: { app: regmap-engine, tier: cpu }
spec:
  # PINNED TO 1 WHILE THE LEDGER IS SQLITE. SQLite is single-writer, so a second replica would either
  # fail to mount the ReadWriteOnce volume or corrupt/split the billing ledger. The HPA must stay
  # disabled for the same reason — see hpa.yaml. Switch DATABASE_URL to managed Postgres before scaling.
  replicas: 1
  # Recreate, NOT RollingUpdate. With a single-writer SQLite ledger on a ReadWriteOnce volume, a
  # rolling update starts the new pod before the old one exits (maxSurge rounds to 1 at one replica),
  # so two processes would briefly hold the same database file open for writing -- a corruption window
  # on every single deploy. Recreate terminates the old pod first: a few seconds of downtime instead.
  # Switch back to RollingUpdate once DATABASE_URL points at managed Postgres.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: regmap-engine, tier: cpu }
  template:
    metadata:
      labels: { app: regmap-engine, tier: cpu }
    spec:
      # Pull the private GHCR image (create the secret: see k8s/README.md "Registry / pull secret").
      imagePullSecrets:
        - name: ghcr
      # Matches the non-root user baked into the image (Dockerfile: useradd -u 10001 appuser).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: engine
          # Digest-pinned (reproducible): the CPU-tier image pushed to GHCR.
          # Rebuild+repush changes the digest — update it here (build slim-CPU: --build-arg TORCH_INDEX=.../cpu).
          image: ghcr.io/samuelgtetteh/regmap-engine@sha256:c2caeb3388dfc290918a6d1d49d88358c35ebcdd3f7add77f398894ffb2bd2c3
          # Digest-pinned so a rollout is reproducible: a tag can be moved, a digest cannot.
          # For local kind testing instead: image: regmap-engine:0.6-cpu + imagePullPolicy: Never
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: ledger
              mountPath: /data
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: REGMAP_DEVICE, value: "cpu" }
            - { name: REGMAP_GPU_CU_MULT, value: "8" }
            # Hosted deployment: enforce accounts. Guests can still browse the catalog; anything that
            # runs the model requires a login or an API key.
            - { name: REGMAP_REQUIRE_AUTH, value: "true" }
            # Enforce metering/quota and rate limits on the live site. The app defaults these OFF for
            # pre-launch development; the live deployment turns them ON explicitly here.
            - { name: REGMAP_ENFORCE_QUOTA, value: "true" }
            - { name: REGMAP_ENFORCE_RATE_LIMIT, value: "true" }
            # Set to "true" once TLS terminates in front of this Service, so session cookies are only
            # ever sent over HTTPS. Left false here because kind has no ingress TLS.
            - { name: REGMAP_SECURE_COOKIES, value: "false" }
          resources:
            requests: { cpu: "250m", memory: "768Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          # Model warms up (~10s) before it's ready; startupProbe guards that window so
          # liveness never kills the pod during warm-up.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30      # up to ~150s to become ready
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: ledger
          persistentVolumeClaim:
            claimName: regmap-ledger
