<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evidence transcript · RegMap University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('regmap.theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':(t==='dark'?'dark':(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark')));}catch(e){}</script>
<link rel="stylesheet" href="assets/site.css?v=37">
<style>
  .tr-card{max-width:820px;margin:0 auto;border:1px solid var(--line);border-radius:20px;background:var(--surface);
    box-shadow:var(--shadow);overflow:hidden}
  .tr-top{padding:26px 28px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent);
    border-bottom:1px solid var(--line)}
  .tr-top .eyebrow{margin-bottom:6px}
  .tr-rank{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .tr-rank .r{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tr-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px}
  .tr-stat b{font-size:22px;display:block}.tr-stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
  .tr-body{padding:24px 28px}
  .tr-h{font-size:13px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
  .badges{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
  .badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:7px 13px;
    border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
  .badge .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--grad);color:#fff}
  table.labs{width:100%;border-collapse:collapse;font-size:13.5px}
  table.labs th,table.labs td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  table.labs th{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
  table.labs .f1{font-family:var(--mono);font-weight:700;color:var(--ok)}
  .tr-foot{padding:20px 28px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .tr-foot .grow{flex:1;min-width:180px;font-size:13px;color:var(--muted)}
  .tr-empty{max-width:560px;margin:40px auto;text-align:center;color:var(--muted)}
</style>
</head>
<body data-page="labs">

<section class="section pad bleed" style="padding-top:34px" id="tr"></section>

<script src="assets/api.js?v=37"></script>
<script src="assets/shell.js?v=37"></script>
<script>
(function () {
  const esc = RegMap.esc, host = document.getElementById("tr");
  const id = new URLSearchParams(location.search).get("id");
  const verified = `<span class="pill ok" title="Scored against official government crosswalks">verified by RegMap</span>`;

  if (!id) { host.innerHTML = `<div class="tr-empty"><h1>Evidence transcript</h1>
    <p>No transcript specified. Learners publish a shareable record from
    <a href="/labs.html" style="color:var(--accent);font-weight:600">RegMap University</a>.</p></div>`; return; }

  RegMap.transcriptGet(id).then(d => render(d)).catch(() => {
    host.innerHTML = `<div class="tr-empty"><h1>Transcript not found</h1>
      <p>This link may be wrong or the transcript was removed.
      <a href="/labs.html" style="color:var(--accent);font-weight:600">Start your own at RegMap University</a>.</p></div>`;
  });

  function render(d) {
    const labs = (d.labs || []);
    const badges = (d.badges || []);
    const when = d.published || (d.updated_at ? d.updated_at.slice(0, 10) : "");
    host.innerHTML = `
      <div class="tr-card">
        <div class="tr-top">
          <div class="eyebrow">RegMap University · Evidence transcript</div>
          <div class="tr-rank">Rank: <span class="r">${esc(d.rank || "Novice")}</span> ${verified}</div>
          <div class="tr-stats">
            <div class="tr-stat"><b>${esc(String(d.xp ?? 0))}</b><span>XP</span></div>
            <div class="tr-stat"><b>${esc(String(d.completed ?? 0))}/${esc(String(d.total ?? 0))}</b><span>lessons</span></div>
            <div class="tr-stat"><b>${esc(String(d.streak ?? 0))}</b><span>day streak</span></div>
            <div class="tr-stat"><b>${labs.length}</b><span>labs passed</span></div>
          </div>
        </div>
        <div class="tr-body">
          ${badges.length ? `<div class="tr-h">Badges</div><div class="badges">${badges.map(b =>
            `<span class="badge"><span class="dot">★</span>${esc(b)}</span>`).join("")}</div>` : ""}
          <div class="tr-h">Graded labs passed</div>
          ${labs.length ? `<table class="labs"><thead><tr><th>Lab</th><th>NICE task</th><th>Score (F1)</th><th>Date</th></tr></thead>
            <tbody>${labs.map(l => `<tr><td>${esc(l.title || "")}</td><td class="mono">${esc(l.nice_task || "")}</td>
              <td class="f1">${(typeof l.f1 === "number" ? l.f1.toFixed(2) : esc(String(l.f1 || "")))}</td>
              <td class="mono">${esc(l.date || "")}</td></tr>`).join("")}</tbody></table>`
            : `<p style="color:var(--muted);font-size:14px">No graded labs passed yet.</p>`}
        </div>
        <div class="tr-foot">
          <div class="grow">Every lab is graded against an official published crosswalk using precision and
            recall. ${when ? "Published " + esc(when) + "." : ""}</div>
          <a class="btn primary" href="/labs.html">Start your own transcript →</a>
        </div>
      </div>`;
  }
})();
</script>
</body>
</html>
