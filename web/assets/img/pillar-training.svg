<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A graded hands-on lab, scored against ground truth">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <style>
      .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
      .dim{fill:#7C8AA6}.ink{fill:#C7D2E8}.cy{fill:#22D3EE}.gr{fill:#34D399}.rd{fill:#FB7185}
      .h{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#7C8AA6;letter-spacing:.12em}
    </style>
  </defs>
  <rect x="6" y="6" width="548" height="288" rx="18" fill="#0B0F19" stroke="#1E2637"/>
  <!-- title bar -->
  <rect x="6" y="6" width="548" height="38" rx="18" fill="#10141F"/>
  <rect x="6" y="26" width="548" height="18" fill="#10141F"/>
  <circle cx="30" cy="25" r="5" fill="#FB7185"/><circle cx="48" cy="25" r="5" fill="#FBBF24"/><circle cx="66" cy="25" r="5" fill="#34D399"/>
  <text x="92" y="29" class="mono dim">regmap-lab  ·  PE-13 map the control</text>
  <line x1="6" y1="44" x2="554" y2="44" stroke="#1E2637"/>

  <!-- body -->
  <g>
    <text x="28" y="72" class="mono dim">$ start lab --pair nist_800-53:hipaa</text>
    <text x="28" y="96" class="mono ink">prompt  PE-13 Fire Protection</text>
    <text x="28" y="120" class="mono cy">select the HIPAA provisions it maps to</text>

    <text x="28" y="150" class="mono gr">[x] 164.310(a)(2)(ii)   correct</text>
    <text x="28" y="172" class="mono gr">[x] 164.308(a)(7)       correct</text>
    <text x="28" y="194" class="mono rd">[ ] 164.312(e)(1)       missed</text>
  </g>

  <!-- result badge -->
  <g transform="translate(28,214)">
    <rect x="0" y="0" width="504" height="52" rx="12" fill="#0F1522" stroke="#2C3650"/>
    <circle cx="30" cy="26" r="11" fill="none" stroke="#34D399" stroke-width="3"/>
    <path d="M25,26 l4,4 l7,-9" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="24" class="mono gr" font-weight="700">PASS</text>
    <text x="52" y="42" class="mono dim">NICE  T0267</text>
    <text x="150" y="24" class="h">PRECISION</text><text x="150" y="42" class="mono ink">0.90</text>
    <text x="250" y="24" class="h">RECALL</text><text x="250" y="42" class="mono ink">1.00</text>
    <text x="340" y="24" class="h">F1</text><text x="340" y="42" class="mono ink">0.94</text>
    <rect x="404" y="14" width="86" height="9" rx="5" fill="#1E2637"/>
    <rect x="404" y="14" width="72" height="9" rx="5" fill="url(#tg)"/>
    <text x="404" y="42" class="h">+120 XP</text>
  </g>
</svg>
